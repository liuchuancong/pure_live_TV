name: pure_live
description: 纯粹直播,一款开源的第三方多平台直播聚合播放器.
publish_to: none
version: 3.0.5+6

environment:
  sdk: ^3.12.0

dependencies:
  # Flutter SDK 基础内置
  flutter:
    sdk: flutter
  collection: ^1.19.1        # Dart集合工具扩展方法
  intl: ^0.20.2              # 国际化、日期数字格式化
  easy_localization: ^3.0.8   # 运行时多语言（assets/translations）
  meta: ^1.18.0              # Dart元注解(Deprecated/required等)
  path: ^1.9.1               # 跨平台文件路径处理
  path_provider: ^2.1.5 # 获取文件路径
  
  # 网络请求、爬虫、Cookie、UA伪装
  dio: ^5.9.2                         # 主流HTTP客户端，项目核心请求库
  dio_cookie_manager: ^3.4.0          # Dio绑定cookieJar自动管理Cookie
  cookie_jar: ^4.0.8                  # Cookie持久化存储容器
  http: ^1.6.0                        # Dart原生基础HTTP备用库
  html_unescape: ^2.0.0              # HTML转义字符还原(&lt;等解码)
  charset_converter: ^2.3.0           # 网页编码转换(gbk/gbk2312等)

  # WebSocket、网络通信、流媒体协议
  web_socket_channel: ^3.0.1          # WebSocket长连接通信
  stream_channel: ^2.1.4             # YY自定义WebSocket通道保留请求头
  connectivity_plus: ^7.1.1           # 网络状态检测(Wi-Fi/移动/无网)

  # 本地持久化数据库 & 缓存
  hive_ce: ^2.15.1                    # 高性能NoSQL本地键值数据库
  cached_network_image: ^3.4.1        # 网络图片本地缓存
  flutter_cache_manager: ^3.4.1       # 通用文件缓存管理

  # 状态管理 & 代码序列化注解
  flutter_riverpod: ^3.3.2            # Riverpod 状态管理
  riverpod_annotation: ^4.0.3          # Riverpod注解生成依赖
  freezed_annotation: ^3.1.0          # 数据模型冻结类注解
  json_annotation: ^4.12.0            # JSON序列化基础注解
  dart_sm: ^0.1.5 # 工具库
  pointycastle: ^4.0.0 # 克拉克拉官方分享链接 AES-CBC 读取
  equatable: ^2.0.7
  html: ^0.15.4 # HTML解析
  drift: ^2.28.0 # iptv本地数据库
  file_picker: ^12.3.0 # iptv导入文件选择
  synchronized: ^3.3.1 # 导入并发控制
  # 路由页面跳转
  go_router: ^18.0.1
  go_transitions: ^0.8.4                  # Flutter官方推荐路由管理

  # UI布局、屏幕适配、图标色彩
  dpad: ^3.0.0                        # TV遥控器方向键导航适配
  flutter_screenutil_plus: ^1.5.0     # 屏幕尺寸适配、字体缩放
  flutter_svg: ^2.3.0  # 播放页弹幕图标（与参考项目同一套 SVG）
  hexcolor: ^3.1.3                    # 十六进制颜色字符串解析
  url_launcher: ^6.1.12               # 唤起外部浏览器、APP跳转

  # 下拉刷新、无限列表、加载动画
  flutter_spinkit: ^5.2.2             # 多种内置加载动画
  loading_animation_widget: ^1.3.0     # 自定义加载动画封装
  loading_indicator: ^3.1.1            # 轻量加载指示器

  # 弹窗、提示、Markdown、二维码
  flutter_smart_dialog: ^5.1.0        # 全局弹窗、Toast、对话框
  qr_flutter: ^4.1.0                  # 生成二维码图片
  markdown_widget: ^2.3.2+8           # 更新页更新日志的 Markdown 渲染

  wakelock_plus: ^1.4.0               # 播放时保持屏幕常亮
  flame_barrage: 0.0.6

  # 文件选择、打开、权限
  open_filex: ^4.7.0                  # 调用第三方APP打开本地文件
  permission_handler: ^12.0.1         # 各平台权限申请管理

  # 设备、APP信息
  device_info_plus: ^13.1.0           # 获取设备型号系统版本
  package_info_plus: ^10.1.0          # 获取APP版本、包名

  # 编解码、加密、压缩、UUID
  crypto: ^3.0.7                      # MD5/SHA等加密哈希算法
  protobuf: ^6.0.0                    # Protobuf二进制序列化协议
  fixnum: ^1.1.1                      # Protobuf固定大小数值类型
  uuid: ^4.5.3                        # 生成唯一UUID标识
  brotli: ^0.6.0                      # Brotli压缩解压

  # 日期时间、日志、计时器
  logger: ^2.7.0                      # 分级日志打印(INFO/WARN/ERROR)
  stop_watch_timer: ^3.2.2            # 高精度计时器、秒表
  alfred: ^1.1.3
  # 动画效果
  flutter_animate: ^4.5.2             # 组件链式动画快捷封装
  rxdart: ^0.28.0
  remixicon: ^4.9.3 # Remix图标库
  flutter_virtual_scroll: ^0.1.1
  marquee_list: ^1.0.0
  android_intent_plus: ^6.0.0
  bonsoir: ^7.1.5
  flutter_inappwebview:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_inappwebview.git
      path: flutter_inappwebview
      ref: 3e6c4c4a25340cd363af9d38891d88498b90be26
  media_core:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_media_kit:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_media_kit
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_fvp:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_fvp
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_live:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_live
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_native:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_native
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_logging:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_logging
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_better_player:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_better_player
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_core_ijk_player:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_core_ijk_player
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  media_kit:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_kit
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9

  media_kit_video:
    git:
      url: https://github.com/liuchuancong/media_core.git
      path: packages/media_kit_video
      ref: 45033b5c9c8ba3e6ed76b5b195bf786dd36ce3f9
  android_tv_text_field: ^1.0.0

# 依赖覆盖（强制指定版本）
dependency_overrides:
  flutter_inappwebview_android:
    path: plugins/built_in_kotlin/flutter_inappwebview_android # 上游网页内核 Android 子包 ProGuard 兼容补丁
  android_tv_text_field:
    path: plugins/built_in_kotlin/android_tv_text_field # 本地 AGP 9 内建 Kotlin 补丁（原生 TV 输入框）
  wakelock_plus: ^1.4.0 # media_kit 声明的版本覆盖

dev_dependencies:
  flutter_test:
    sdk: flutter # Flutter单元测试框架
  flutter_lints: ^6.0.0 # Dart代码静态规范检查
  # 代码生成核心
  build_runner: ^2.15.0 # Dart代码生成执行器

  # Hive数据库模型生成
  hive_ce_generator: ^1.11.2

  # 冻结数据类生成
  freezed: ^3.2.5 # freezed模型生成工具

  # JSON序列化生成
  json_serializable: ^6.14.0

  # 路由代码生成
  go_router_builder: ^4.5.0

  # Riverpod状态代码生成
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  
# 应用图标生成配置
flutter_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/icon_foreground.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icons/icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icons/icon.png

# Flutter工程基础配置
flutter:
  uses-material-design: true
  # 静态资源目录
  assets:
    - assets/
    - assets/images/
    - assets/images/video/
    - assets/icons/
    - assets/translations/
    - assets/web_remote/
    - assets/web_remote/assets/
    - assets/version.json
    - assets/releases.json
    - assets/emo/images/huya/
    - assets/emo/images/douyu/
    - assets/emo/images/douyin/
    - assets/emo/images/bilibili/
    - assets/emo/json/
    - assets/fonts/fonts-manifest.json