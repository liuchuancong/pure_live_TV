name: tv_remote_kit
description: "LAN remote-sync kit for the PureLive TV app: mDNS broadcast/discovery (bonsoir), the purelive:// QR protocol and a small HTTP server exposing sync and per-channel input endpoints."
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bonsoir: ^7.1.5

dev_dependencies:
  flutter_lints: ^5.0.0
